jpro.syntax = [accent]Quick syntax (Java-like)[]\nVariables: int x = 5;   double d = 1.5;   var u = @unit;   Constants: final int N = 10;\nGame content: @copper, @unit, @time, @copper-wall   Color: #ff8800\nBranching: if (a < b) { } else { }   switch (x) { case 1, 2 -> { }  default -> { } }   or case 1: ... break;\nLoops: while (x < 5) { }   for (int i = 0; i < 10; i++) { }   while (true) { }\nFunctions: int add(int a, int b) { return a + b; }   void run() { }\nEnd each statement with ;   Run once: once { ... }   Stop: end; (restart), stop; (halt)\nMemory: cell1[3] = 7;   Property: u.health = 100;\nRaw mlog: asm { ... }\nCall: print("x=", x); unit.move(10, 10); world.spawn(@dagger, 10, 10);\nComments: // one line   /* multiple lines */

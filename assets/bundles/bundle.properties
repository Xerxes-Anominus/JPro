jpro.level.note = [sky][Lv2][] = functions only available on the Level 2 (world) processor: world.*, cutscene.*, property assignment (u.health = 1), sync, localePrint, and drawing on the world with Draw / Drawf / Lines / Fill. Level 1 behaves like a logic processor.

jpro.syntax = [accent]Cú pháp nhanh (giống Java)[]\nBiến: int x = 5;   double d = 1.5;   var u = @unit;   Hằng: final int N = 10;\nNội dung game: @copper, @unit, @time, @copper-wall   Màu: #ff8800\nRẽ nhánh: if (a < b) { } else { }   switch (x) { case 1, 2 -> { }  default -> { } }   hoặc case 1: ... break;\nLặp: while (x < 5) { }   for (int i = 0; i < 10; i++) { }   while (true) { }\nHàm: int cong(int a, int b) { return a + b; }   void chay() { }\nMỗi câu lệnh kết thúc bằng dấu ;   Chạy một lần: once { ... }   Dừng: end; (chạy lại từ đầu), stop; (dừng hẳn)\nBộ nhớ: cell1[3] = 7;   Thuộc tính: u.health = 100;\nMlog thô: asm { ... }\nGọi hàm: print("x=", x); unit.move(10, 10); world.spawn(@dagger, 10, 10);\nChú thích: // một dòng   /* nhiều dòng */\nExport biến: export copper;   Import biến: import processor1.copper;\nExport hàm: exportFunc update;   Import hàm: importFunc processor1.update;
